name: scrutate
description: Install a Scrutate release binary, run a command (search, check, dupes, ...) in CI, and post the review of a pull request as one comment.
inputs:
  version:
    description: release tag to install (e.g. v0.1.0)
    required: true
  args:
    description: arguments passed to scrutate (e.g. dupes --json --limit 20); quote an argument that has spaces or an apostrophe; a backslash is kept as written, except before a blank, a quote or a backslash, which it escapes; none runs no command
    required: false
    default: ''
  comment:
    description: on a pull request, post scrutate review as one comment and edit it on the next push (needs pull-requests write permission and a checkout with fetch-depth 0)
    required: false
    default: 'false'
  github-token:
    description: the token the comment is posted with
    required: false
    default: ${{ github.token }}
outputs:
  exit-code:
    description: the command's exit code (0 results, 1 none); the step fails on 2 (an error) and above
    value: ${{ steps.run.outputs.exit-code }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      # the one value written to GITHUB_PATH is built from a version whose shape is checked first
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v0.1.0, got: $VERSION"; exit 1; }
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) t=x86_64-unknown-linux-musl ;;
          Linux-ARM64) t=aarch64-unknown-linux-musl ;;
          macOS-ARM64) t=aarch64-apple-darwin ;;
          macOS-X64) t=x86_64-apple-darwin ;;
          Windows-X64) t=x86_64-pc-windows-msvc ;;
          Windows-ARM64) t=aarch64-pc-windows-msvc ;;
          *) echo "no scrutate release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        name=scrutate-${VERSION#v}-$t
        if [ "$RUNNER_OS" = Windows ]; then ext=zip; else ext=tar.gz; fi
        url=https://github.com/scrutate/scrutate/releases/download/$VERSION
        # outside the checkout, so the tool does not search its own files
        cd "$RUNNER_TEMP"
        curl -sSfL -o "$name.$ext" "$url/$name.$ext"
        curl -sSfL -o "$name.sha256" "$url/$name.sha256"
        if command -v sha256sum > /dev/null; then sha256sum -c "$name.sha256"; else shasum -a 256 -c "$name.sha256"; fi
        if [ "$ext" = zip ]; then unzip -o -q "$name.zip"; else tar xzf "$name.tar.gz"; fi
        echo "$(pwd -W 2> /dev/null || pwd)/$name" >> "$GITHUB_PATH"
    - id: run
      if: inputs.args != ''
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      # xargs splits the arguments and honours quotes without handing them to a shell; the code goes
      # through a file because xargs replaces any non-zero code of its command with its own
      run: |
        code_file=$RUNNER_TEMP/scrutate-exit-code
        rm -f "$code_file"
        # xargs drops a backslash outside quotes (\bTODO\b, C:\repo): double each one that is not
        # before a blank, a quote or a backslash, so xargs' own escapes (foo\ bar, don\'t) still work
        kept='' q=''
        for ((i = 0; i < ${#ARGS}; i++)); do
          c=${ARGS:i:1}
          if [ -n "$q" ]; then [ "$c" != "$q" ] || q=''
          elif [ "$c" = "'" ] || [ "$c" = '"' ]; then q=$c
          elif [ "$c" = "\\" ]; then
            n=${ARGS:i+1:1}
            case $n in [[:blank:]\'\"\\]) c+=$n; i=$((i + 1)) ;; *) c="\\\\" ;; esac
          fi
          kept+=$c
        done
        printf '%s\n' "$kept" | xargs sh -c 'scrutate "$@"; echo $? > "$0"' "$code_file"
        code=$(cat "$code_file")
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        [ "$code" -lt 2 ]
    - if: inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # the script exits 0 on its own errors; the fallback covers bash failing to start it
      run: |
        bash "$GITHUB_ACTION_PATH/comment.sh" || echo "::warning::scrutate review comment: the script did not run"
