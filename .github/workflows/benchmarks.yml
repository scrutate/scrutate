# Benchmark regression gate. A shared runner is not the machine a committed baseline came from, so
# the jobs build two binaries on the runner, the change and the commit it is measured against
# (the merge base of a pull request; the `base` input of a manual run; the last `v*` tag, else
# HEAD~1, on the weekly run), and compare them in one run on one runner:
# - wall time: both in ONE leaderboard run, in the same interleaved blocks, on the corpora a runner
#   measures in time (ripgrep, rgbuilt, patho, binheavy, smallfiles, bigfile, startup). A slow
#   minute slows both; a row regresses when the 95% interval of the ratio lies above 1.10.
# - instructions: every leaderboard benchmark under cachegrind, one search thread, which a busy
#   runner does not move; a row regresses past 1% more instructions (bench/instructions.py).
# Numbers from here never reach docs/LEADERBOARD.md.
# The job to require is "benchmark gate". It runs on every pull request and passes when the
# change touches nothing a benchmark runs: a skipped job reports success, a skipped workflow
# would stay "Pending". Manual runs prove the gate: mode same-binary measures HEAD against
# itself (every row must read same), planted measures HEAD built at opt-level 1 against HEAD at
# opt-level 3 and passes only when the gate catches it.
name: benchmarks
on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      base:
        description: commit, tag or branch to compare against (compare mode; empty means the last v* tag, else HEAD~1)
        type: string
        default: ""
      mode:
        description: compare (the base), same-binary (HEAD against itself), planted (a known slowdown that must fail the gate)
        type: choice
        options: [compare, same-binary, planted]
        default: compare
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  # the two proof runs on one branch must not cancel each other
  group: benchmarks-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true
env:
  MODE: ${{ inputs.mode || 'compare' }}
jobs:
  scope:
    name: what to measure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          if [ "$MODE" != compare ]; then
            base=HEAD
          elif [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          else
            base=${INPUT_BASE:-$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || echo HEAD~1)}
          fi
          base=$(git rev-parse --verify "$base^{commit}")
          run=true
          if [ "$EVENT" = pull_request ] && git diff --quiet "$base" HEAD -- crates vendor Cargo.lock Cargo.toml rust-toolchain.toml .cargo bench .github/workflows/benchmarks.yml; then
            run=false
            echo "nothing a benchmark runs changed since $base: the gate passes without measuring"
          fi
          echo "base $base, HEAD $(git rev-parse HEAD), mode $MODE, measure $run"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
  build:
    name: build the change and its base
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE: ${{ needs.scope.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install --no-self-update
      # both binaries at paths of the same length: argv[0] is on the stack cachegrind counts over
      - run: |
          mkdir -p bin/new bin/old
          cargo build --release -p scrutate --locked
          cp target/release/scrutate bin/new/scrutate
          if [ "$MODE" = planted ]; then
            cp bin/new/scrutate bin/old/scrutate
            CARGO_PROFILE_RELEASE_OPT_LEVEL=1 cargo build --release -p scrutate --locked
            cp target/release/scrutate bin/new/scrutate
          elif [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            cp bin/new/scrutate bin/old/scrutate
          else
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
            (cd "$RUNNER_TEMP/base" && rustup toolchain install --no-self-update && cargo build --release -p scrutate --locked --target-dir "$GITHUB_WORKSPACE/target")
            cp target/release/scrutate bin/old/scrutate
          fi
          sha256sum bin/*/scrutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: bin
          if-no-files-found: error
          retention-days: 3
  walltime:
    name: wall time against the base, small corpora
    needs: [scope, build]
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the structural rows compute their reference with Python tree-sitter through uv
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: hyperfine 2.0.0 (the harness reads its JSON; the distribution ships 1.x)
        run: |
          name=hyperfine-v2.0.0-x86_64-unknown-linux-gnu
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/sharkdp/hyperfine/releases/download/v2.0.0/$name.tar.gz"
          echo "ae2beda2ac99c098427e4f755244552daf20e514422889cca6d44421e2d93c87  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/$name/hyperfine" /usr/local/bin/hyperfine
          hyperfine --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP"/bin/*/scrutate
      # linux is fetched only to generate bigfile, smallfiles, binheavy and rgbuilt from it
      - name: corpora (pinned revisions)
        run: |
          python3 bench/corpora.py --root "$RUNNER_TEMP/corpora" --only linux ripgrep bigfile smallfiles binheavy patho rgbuilt startup
          df -h "$RUNNER_TEMP"
      # no competitor is installed, but the runner's grep and git grep are found and timed too: the
      # gate compares scrutate with its base only, and fails a change cut to one run for being 20x
      # slower than the fastest tool. The load wait is short because both binaries share every
      # block, so load slows both alike.
      - name: leaderboard suite, the change and its base in the same blocks
        run: |
          SCRUTATE_BIN="$RUNNER_TEMP/bin/new/scrutate" SCRUTATE_BASE_BIN="$RUNNER_TEMP/bin/old/scrutate" python3 bench/leaderboard.py \
            --corpora "$RUNNER_TEMP/corpora" --out leaderboard.json --only ripgrep/ rgbuilt/ patho/ binheavy/ smallfiles/ bigfile/ startup/ \
            --blocks 6 --max-load "$(nproc)" --max-wait 30
      - name: gate
        run: |
          s=0
          python3 bench/leaderboard_regression.py --within leaderboard.json || s=$?
          if [ "$MODE" != planted ]; then exit "$s"; fi
          [ "$s" = 1 ] || { echo "::error::the planted slowdown did not fail the wall-time gate (exit $s)"; exit 1; }
          echo "the planted slowdown failed the gate, as it must"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: leaderboard.json
          retention-days: 30
  counts:
    name: instructions against the base (${{ matrix.group }})
    needs: [scope, build]
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: linux
            corpora: linux
            only: linux/
            skip: linux/structural
          # tree-sitter parses every C file of the tree on one thread, twice: a runner of its own
          - group: linux-structural
            corpora: linux
            only: linux/structural
            skip: ""
          - group: llvm
            corpora: llvm
            only: llvm/
            skip: ""
          - group: small
            corpora: linux ripgrep bigfile smallfiles binheavy patho rgbuilt startup
            only: ripgrep/ rgbuilt/ patho/ binheavy/ smallfiles/ bigfile/ startup/
            skip: ""
    env:
      GROUP: ${{ matrix.group }}
      CORPORA: ${{ matrix.corpora }}
      ONLY: ${{ matrix.only }}
      SKIP: ${{ matrix.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y valgrind=1:3.22.0-0ubuntu3
          valgrind --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP"/bin/*/scrutate
      - name: corpora (pinned revisions)
        run: |
          # shellcheck disable=SC2086 # the lists split into arguments
          python3 bench/corpora.py --root "$RUNNER_TEMP/corpora" --only $CORPORA
          df -h "$RUNNER_TEMP"
      - name: gate
        run: |
          s=0
          # shellcheck disable=SC2086 # the lists split into arguments
          python3 bench/instructions.py --corpora "$RUNNER_TEMP/corpora" --new "$RUNNER_TEMP/bin/new/scrutate" --base "$RUNNER_TEMP/bin/old/scrutate" \
            --out "instructions-$GROUP.json" --only $ONLY --skip $SKIP || s=$?
          if [ "$MODE" != planted ]; then exit "$s"; fi
          [ "$s" = 1 ] || { echo "::error::the planted slowdown did not fail the instruction gate (exit $s)"; exit 1; }
          echo "the planted slowdown failed the gate, as it must"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: instructions-${{ matrix.group }}
          path: instructions-${{ matrix.group }}.json
          retention-days: 30
  # the one check to require: a skipped matrix job reports under its unexpanded name, and a job
  # skipped because one it needs failed may not block a merge, so this one reads every result
  gate:
    name: benchmark gate
    needs: [scope, build, walltime, counts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "scope build walltime counts: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
