# Release: binaries for every declared platform, abi3, cp314t and abi3t wheels, checksums, SBOM and
# build provenance attestations (Sigstore, via GitHub artifact attestations). Triggered by a tag.
# A manual run builds, tests and packages on every platform, and publishes and signs nothing.
# With dry_run it rehearses the whole tag path: ci.yml, the attestations, and a draft release
# named rehearsal-<run id>, which it checks and then deletes.
# The build jobs can only read the repository. The one job that signs and publishes runs in the
# `release` environment (`rehearsal` for a dry run), and the release stays a draft until every
# file is attached. Nothing is published unless the tag names the version the code declares and
# every ci.yml and security.yml job passed on the tagged commit.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: also run ci.yml, attest, and make and delete a draft release rehearsal-<run id>
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: the tag matches the code's version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a rehearsal has no tag: it takes the version the code declares
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/scrutate/Cargo.toml | head -1); fi
          python3 tools/check_version.py "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
  ci:
    name: ci on the tagged commit
    needs: version
    if: github.ref_type == 'tag' || inputs.dry_run
    # the documented form for a workflow of the same repository and commit; actionlint rejects $/
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
  security:
    name: security on the tagged commit
    needs: version
    if: github.ref_type == 'tag' || inputs.dry_run
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
  binaries:
    name: binary (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # a glibc binary starts only where glibc is at least the build machine's: one built on
          # Ubuntu 24.04 asks for GLIBC_2.39 and does not start on Debian 12 or Ubuntu 22.04
          - { os: ubuntu-22.04,      target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-22.04-arm,  target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest,      target: aarch64-apple-darwin }
          - { os: macos-15-intel,    target: x86_64-apple-darwin }
          - { os: windows-latest,    target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm,    target: aarch64-pc-windows-msvc }
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # read by build.rs on glibc Linux alone; set for the tests too, so they reuse the ordered link
      SCRUTATE_LINUX_ORDER: ${{ github.workspace }}/target/startup.order.elf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # after the install, so the target lands on the toolchain rust-toolchain.toml pins
      - shell: bash
        run: rustup toolchain install --no-self-update && rustup target add "$TARGET"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - if: matrix.musl
        run: sudo apt-get -o Acquire::Retries=5 install -y musl-tools
      - shell: bash
        run: cargo build --release -p scrutate --target "$TARGET" --locked
      # the functions a small search runs, side by side, under this build's own names: a second link
      - name: function order (glibc Linux)
        if: endsWith(matrix.target, '-linux-gnu')
        run: |
          python3 tools/order_file.py --elf "$SCRUTATE_LINUX_ORDER.map" "$SCRUTATE_LINUX_ORDER"
          cargo build --release -p scrutate --target "$TARGET" --locked
          python3 tools/order_file.py --elf-check "$SCRUTATE_LINUX_ORDER.map" "$SCRUTATE_LINUX_ORDER"
      - name: the glibc binary needs no glibc newer than 2.34
        if: endsWith(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          newest=$(objdump -T "target/$TARGET/release/scrutate" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc version asked for: $newest"
          [ "$(printf '%s\n' GLIBC_2.34 "$newest" | sort -V | tail -1)" = GLIBC_2.34 ]
      - shell: bash
        run: cargo test --release -p scrutate --target "$TARGET" --locked
      - name: package
        shell: bash
        run: |
          set -e
          v=$VERSION
          mkdir -p dist
          bin=target/$TARGET/release/scrutate
          [ -f "$bin.exe" ] && bin="$bin.exe"
          name=scrutate-$v-$TARGET
          mkdir -p "$name"
          cp "$bin" LICENSE-APACHE LICENSE-MIT README.md CHANGELOG.md "$name/"
          python tools/third_party_notices.py --out "$name/THIRD_PARTY_NOTICES.txt"
          cp -r docs integrations "$name/"
          if [[ "$TARGET" == *windows* ]]; then 7z a "dist/$name.zip" "$name" > /dev/null; else tar czf "dist/$name.tar.gz" "$name"; fi
          sum() { if command -v sha256sum > /dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd dist && sum -- * > "$name.sha256")
      # after the archive's .sha256, which lists the archive alone; SHA256SUMS covers the packages
      - name: .deb and .rpm
        if: endsWith(matrix.target, '-linux-gnu')
        shell: bash
        run: sh packaging/linux/build-packages.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.kind }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"  # as .cargo/config.toml; maturin reads it for the wheel tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        kind: [abi3, free-threaded, abi3t]
        # abi3: one cp39-abi3 wheel for standard CPython up to 3.14. free-threaded: a cp314t wheel
        # (3.14 has no stable ABI without the GIL). abi3t: one wheel for 3.15 and newer, both builds.
        include:
          - { kind: abi3, python: "3.12", interpreter: python3.12 }
          - { kind: free-threaded, python: "3.14t", interpreter: python3.14t }
          - { kind: abi3t, python: "3.15", interpreter: python3.15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: notices of the crates compiled into the wheel
        shell: bash
        run: |
          cmp -s LICENSE-APACHE crates/scrutate-py/LICENSE-APACHE
          cmp -s LICENSE-MIT crates/scrutate-py/LICENSE-MIT
          python tools/third_party_notices.py --package scrutate-py --out crates/scrutate-py/THIRD_PARTY_NOTICES.txt
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.16.0
          # Linux builds in a manylinux container, which has its own interpreters; elsewhere the
          # interpreter is the one setup-python put on PATH
          args: --release --strip -m crates/scrutate-py/Cargo.toml -o dist -i ${{ runner.os == 'Linux' && matrix.interpreter || 'python' }}
          manylinux: ${{ runner.os == 'Linux' && '2_34' || 'auto' }}
      - name: install and test the wheel on this platform
        shell: bash
        run: |
          pip install --no-deps dist/scrutate-*.whl
          # a module not marked gil_used = false turns the GIL back on at import, with only a warning
          python -c "import scrutate, sys, sysconfig; print(scrutate.__version__); print(list(scrutate.grep('fn ', ['crates'], mode='literal'))[:1]); ft = sysconfig.get_config_var('Py_GIL_DISABLED') == 1; gil = getattr(sys, '_is_gil_enabled', lambda: True)(); print('free-threaded:', ft, 'gil enabled:', gil); assert not (ft and gil), 'importing scrutate turned the GIL on'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.kind }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
  vsix:
    name: the VS Code extension
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"  # vsce 4 and ovsx 1.4 need 22 or newer
          package-manager-cache: false
      # vsce refuses SVG images, and the README's generated head is one; links resolve on GitHub
      - working-directory: integrations/vscode
        run: |
          sed -i '/^<!-- Head written by/,/^<!-- End of head. -->/d' README.md
          npm ci
          npx --yes @vscode/vsce@4.1.1 package --out "$GITHUB_WORKSPACE/dist/scrutate-$VERSION.vsix" \
            --baseContentUrl "https://github.com/$GITHUB_REPOSITORY/blob/HEAD/integrations/vscode" \
            --baseImagesUrl "https://github.com/$GITHUB_REPOSITORY/raw/HEAD/integrations/vscode"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 7
  release:
    name: sign and publish
    needs: [version, ci, security, binaries, wheels, vsix]
    if: github.ref_type == 'tag' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # the release environment takes tags only; a rehearsal runs from a branch
    environment: ${{ github.ref_type == 'tag' && 'release' || 'rehearsal' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REHEARSAL: ${{ github.ref_type != 'tag' }}
    permissions:
      contents: write          # the release itself
      id-token: write          # Sigstore signing of the attestations
      attestations: write      # storing them with the repository
      artifact-metadata: write # the storage record each attestation gets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      # by name: the ci jobs of this run upload binaries too, and those are not release files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: artifacts
      - name: SBOM (CycloneDX, from the locked dependency graph)
        run: python3 tools/sbom.py --out "artifacts/scrutate-$VERSION.cdx.json"
      - name: combined checksums
        run: cd artifacts && sha256sum -- *.tar.gz *.zip *.deb *.rpm *.whl *.vsix *.cdx.json > SHA256SUMS
      - name: build provenance for every file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.whl
            artifacts/*.vsix
            artifacts/SHA256SUMS
      - name: the SBOM, bound to the archives it describes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
          sbom-path: artifacts/scrutate-${{ env.VERSION }}.cdx.json
      - name: draft, attach, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # the notes are this version's section of CHANGELOG.md; a release without one stops here
          awk -v v="[$VERSION]" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          if [ "$REHEARSAL" = true ]; then
            tag=rehearsal-$GITHUB_RUN_ID
            # a draft makes no tag until it is published; the tag check covers a draft that did
            trap 'gh release delete "$tag" --yes || true; if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"; fi' EXIT
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "$tag (not a release)" --notes-file "$RUNNER_TEMP/notes.md" artifacts/*
            # what a user checks: every file on the draft, and the provenance of this workflow on this ref
            test "$(gh release view "$tag" --json assets -q '.assets | length')" = "$(find artifacts -maxdepth 1 -type f | wc -l)"
            gh attestation verify artifacts/SHA256SUMS --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" artifacts/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
  # The publishing jobs below do nothing until the owner sets them up (docs/RELEASING.md section 7):
  # each waits for a repository variable, or for its token, so a release without them succeeds.
  testpypi:
    name: wheels to TestPyPI
    needs: release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi  # the trusted publisher on test.pypi.org names it
    permissions:
      id-token: write  # trusted publishing; no password
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # a name uploaded once can never be uploaded again; a rehearsal already sent this version
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
  pypi:
    name: wheels to PyPI
    needs: testpypi
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi  # the trusted publisher on pypi.org names it
    permissions:
      id-token: write  # trusted publishing; no password
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  marketplace:
    name: the extension to the VS Code Marketplace
    needs: [version, release]
    if: github.ref_type == 'tag' && vars.VSCE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace  # the Marketplace's trusted publishing policy names it
    env:
      VERSION: ${{ needs.version.outputs.version }}
    permissions:
      id-token: write  # trusted publishing: the Marketplace takes the OIDC token, no PAT
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "dist/scrutate-$VERSION.vsix"
  openvsx:
    name: the extension to Open VSX
    needs: [version, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openvsx  # holds the OVSX_PAT secret
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - if: env.OVSX_PAT == ''
        run: echo "no OVSX_PAT secret in the openvsx environment; Open VSX is skipped"
      - if: env.OVSX_PAT != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist
      - if: env.OVSX_PAT != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      # ovsx reads the token from OVSX_PAT
      - if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.4.0 publish "dist/scrutate-$VERSION.vsix"
