# OpenSSF Scorecard on every push to main and once a week: its findings go to the code scanning
# dashboard and its score to api.scorecard.dev. With publish_results the Scorecard API rejects a
# workflow with top-level env or defaults, write permissions above the job, or a step other than
# checkout, upload-artifact, upload-sarif, scorecard-action or harden-runner, so this file has none.
name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 6"
permissions: {}
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      actions: read # the workflow runs Scorecard's checks read
      security-events: write # upload-sarif to code scanning
      id-token: write # publish_results signs the result with the workflow's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
