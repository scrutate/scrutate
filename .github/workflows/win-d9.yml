# Throwaway, for an audit/ci test branch only: two Windows tests (a clear while a segment is
# mapped; Ctrl-Break through the console handler) on the two Windows runners.
name: win-d9
on:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  rust:
    name: windows tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - name: a clear while another handle maps a segment
        run: |
          cargo test --release -p scrutate --locked --no-fail-fast --lib -- a_clear_while_another_handle_maps_a_segment --nocapture 2>&1 | tee clear.log
          grep -E "directories left by the clear while mapped|test result" clear.log
          grep -q "test result: ok. 1 passed" clear.log
      - name: Ctrl-Break, twenty times
        if: always()
        run: |
          cargo test --release -p scrutate --locked --test cli --no-run
          fail=0
          for i in $(seq 1 20); do
            echo "=== run $i"
            cargo test --release -p scrutate --locked --test cli -- ctrl_break_stops_a_search_and_an_index_build_on_windows --nocapture 2>&1 | tee -a cb.log || fail=$((fail+1))
          done
          ok=$(grep -c "test result: ok. 1 passed" cb.log || true)
          echo "failed runs: $fail of 20; runs with exactly one test passed: $ok"
          test "$fail" -eq 0
          test "$ok" -eq 20
      - name: the whole cli target and the index unit tests
        if: always()
        run: |
          cargo test --release -p scrutate --locked --no-fail-fast --test cli
          cargo test --release -p scrutate --locked --no-fail-fast --lib -- index::
