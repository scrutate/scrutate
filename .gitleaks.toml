# gitleaks 8.30.1's own rules over the tree (security.yml), with each thing this repository holds
# that they take for a secret, and why it is none. Tests build their secret samples at run time.
title = "scrutate"

[extend]
useDefault = true

[[allowlists]]
description = "FNV-1a's 64-bit offset basis, a published constant: intel.rs hashes with it and secrets.rs tests that it stays unredacted"
condition = "AND"
paths = ['''^crates/scrutate/src/(?:intel|secrets)\.rs$''']
regexes = ['''^0xcbf29ce484222325u64$''']
