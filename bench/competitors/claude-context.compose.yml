# What claude-context needs beside the yardstick image: Milvus standalone (from Milvus v3.0.6's own
# milvus-standalone-docker-compose.yaml, its volume-owner migration left out on a fresh volume) and
# Ollama with the embedding model. grepai uses the same Ollama.
#   docker compose -f bench/competitors/claude-context.compose.yml up -d --wait
#   docker compose -f bench/competitors/claude-context.compose.yml exec ollama ollama pull nomic-embed-text
# Milvus answers on 127.0.0.1:19530 (MILVUS_ADDRESS), Ollama on 127.0.0.1:11434 (OLLAMA_HOST).
name: yardstick-semantic
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      retries: 6
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 6
  milvus:
    image: milvusdb/milvus:v3.0.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      retries: 12
    ports:
      - "127.0.0.1:19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.40.16
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
